# Install hooks for both the commit itself and the commit message
default_install_hook_types: [pre-commit, commit-msg]

# Lockfiles are generated by tools; never reformat them by hand
exclude: ^(backend/uv\.lock|frontend/pnpm-lock\.yaml)$

repos:
  # Generic hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Python lint + format (uses the config in backend/pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Enforce Conventional Commits messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # Project-specific checks that run our own toolchains
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: frontend-checks
        name: typecheck + eslint (frontend)
        entry: bash -c 'cd frontend && pnpm typecheck && pnpm lint'
        language: system
        files: ^frontend/
        pass_filenames: false
